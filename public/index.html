
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket.IO Chat</title>
  </head>

  <body>
    <h1>Socket.IO Demo</h1>

    <!-- Login form -->
    <h3>Login</h3>
    <input id="usernameInput" placeholder="Username" />
    <input id="passwordInput" type="password" placeholder="Password" />
    <button id="loginButton">Login</button>
    <p id="loginStatus"></p>

    <!-- Chat room selection -->
    <select id="roomSelect">
      <option value="general">General</option>
      <option value="react">React</option>
      <option value="nodeJs">Node.js</option>
    </select>
    <button id="joinRoomButton">Join Room</button>

    <!-- Room messages -->
    <input id="messageInput" placeholder="Enter message" />
    <button id="sendButton">Send</button>

    <!-- Private messages -->
    <input id="recipientInput" placeholder="Recipient username" />
    <input id="privateMessageInput" placeholder="Enter private message" />
    <button id="privateSendButton">Send Private</button>

    <!-- Messages and online users -->
    <h3>Messages</h3>
    <ul id="messages"></ul>

    <h3>Online Users</h3>
    <ul id="onlineUsers"></ul>

    <p id="typingIndicator"></p>

    <script src="/socket.io/socket.io.js"></script>

    <script>
      let authToken = null;
      let socket = null;
      let typingTimeout;

      const messageInput = document.getElementById("messageInput");
      const typingIndicator = document.getElementById("typingIndicator");
      const messagesList = document.getElementById("messages");
      const loginStatus = document.getElementById("loginStatus");

      // Log in and receive a JWT token
      document.getElementById("loginButton").addEventListener("click", async () => {
        const username = document.getElementById("usernameInput").value.trim();
        const password = document.getElementById("passwordInput").value;

        if (!username || !password) {
          loginStatus.textContent = "Enter username and password.";
          return;
        }

        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ username, password }),
          });

          const data = await response.json();

          if (!response.ok) {
            loginStatus.textContent = data.message;
            return;
          }

          authToken = data.token;
          loginStatus.textContent = "Login successful. Connecting to chat...";

          // Close the previous connection if the user logs in again
          if (socket) {
            socket.disconnect();
          }

          // Send the JWT token when connecting to Socket.IO
          socket = io({
            auth: {
              token: authToken,
            },
          });

          socket.on("connect", () => {
            loginStatus.textContent = "Login successful. Connected to chat.";
          });

          socket.on("connect_error", (error) => {
            loginStatus.textContent = `Connection failed: ${error.message}`;
          });

          // Update the online users list
          socket.on("onlineUsers", (users) => {
            const onlineUsersList = document.getElementById("onlineUsers");
            onlineUsersList.innerHTML = "";

            users.forEach((username) => {
              const li = document.createElement("li");
              li.textContent = username;
              onlineUsersList.appendChild(li);
            });
          });

          // Display typing status
          socket.on("typing", (username) => {
            typingIndicator.textContent = `${username} is typing...`;
          });

          socket.on("stopTyping", () => {
            typingIndicator.textContent = "";
          });

          // Display room messages
          socket.on("message", (message) => {
            const li = document.createElement("li");

            if (typeof message === "object" && message !== null) {
              li.textContent = `${message.username}: ${message.message}`;
            } else {
              li.textContent = message;
            }

            messagesList.appendChild(li);
          });

          // Display private messages
          socket.on("privateMessage", ({ from, message }) => {
            const li = document.createElement("li");
            li.textContent = `[Private] ${from}: ${message}`;
            messagesList.appendChild(li);
          });

          // Show server-side validation errors
          socket.on("validationError", (error) => {
            alert(error);
          });
        } catch (error) {
          loginStatus.textContent = "Unable to connect to the server.";
          console.error("Login request failed:", error);
        }
      });

      // Send typing status to other users
      function handleTyping() {
        if (!socket || !socket.connected) return;

        if (messageInput.value.trim() === "") {
          clearTimeout(typingTimeout);
          socket.emit("stopTyping");
          return;
        }

        socket.emit("typing");

        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
          socket.emit("stopTyping");
        }, 1000);
      }

      messageInput.addEventListener("input", handleTyping);

      // Join the selected room
      document.getElementById("joinRoomButton").addEventListener("click", () => {
        if (!socket || !socket.connected) {
          alert("Please log in and connect first.");
          return;
        }

        const selectedRoom = document.getElementById("roomSelect").value;
        socket.emit("joinRoom", selectedRoom);
      });

      // Send a room message
      document.getElementById("sendButton").addEventListener("click", () => {
        if (!socket || !socket.connected) {
          alert("Please log in and connect first.");
          return;
        }

        const text = messageInput.value.trim();

        if (!text) {
          alert("Please enter a message before sending.");
          return;
        }

        socket.emit("message", text);
        messageInput.value = "";

        clearTimeout(typingTimeout);
        socket.emit("stopTyping");
      });

      // Send a private message
      document.getElementById("privateSendButton").addEventListener("click", () => {
        if (!socket || !socket.connected) {
          alert("Please log in and connect first.");
          return;
        }

        const recipient = document.getElementById("recipientInput").value.trim();
        const message = document.getElementById("privateMessageInput").value.trim();

        if (!recipient || !message) {
          alert("Enter a recipient username and message.");
          return;
        }

        socket.emit("privateMessage", { to: recipient, message });
        document.getElementById("privateMessageInput").value = "";
      });
    </script>
  </body>
</html>
